<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5fd" />
    <meta
      name="description"
      content="Quicklist: uma lista de compras simples e organizada."
    />
    <title>Quicklist | Compras da semana</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/index.css" />
  </head>

  <body>
    <header class="site-header" aria-label="Quicklist">
      <a class="logo" href="index.html" aria-label="Quicklist - início">
        <img src="img/logo.svg" alt="" />
        <span>quicklist</span>
      </a>
    </header>

    <main class="app-container">
      <button class="back-button" id="backButton" type="button">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m12 19-7-7 7-7" />
          <path d="M19 12H5" />
        </svg>
        Voltar
      </button>
      <h1>Compras da semana</h1>
      <form class="add-form" id="addForm" autocomplete="off">
        <label class="sr-only" for="itemInput">Nome do novo item</label>
        <input
          id="itemInput"
          name="item"
          type="text"
          maxlength="100"
          placeholder="Adicione um novo item"
        />
        <button class="add-button" type="submit">Adicionar item</button>
      </form>
      <p class="form-error" id="formError" role="alert" hidden>
        Digite o nome de um item para adicionar.
      </p>
      <ul
        class="shopping-list"
        id="shoppingList"
        aria-label="Lista de compras"
      ></ul>
      <p class="empty-state" id="emptyState" hidden>
        Sua lista está vazia. Adicione um item acima!
      </p>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden>
        <span class="toast-icon" aria-hidden="true">!</span>
        <span id="toastMessage">O item foi removido da lista</span>
        <button id="closeToast" type="button" aria-label="Fechar alerta">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
